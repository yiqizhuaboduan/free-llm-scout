name: Daily Check-in Keeper

on:
  schedule:
    # 22:30 UTC = 06:30 北京时间 — before the working day starts
    - cron: '30 22 * * *'
  workflow_dispatch: # Manual trigger

env:
  # Cookies exported once from a logged-in browser session (NOT passwords).
  # When a cookie expires the run fails loudly so you know to re-export.
  MODELSCOPE_COOKIE: ${{ secrets.MODELSCOPE_COOKIE }}
  MODELSCOPE_CHECKIN_URL: ${{ secrets.MODELSCOPE_CHECKIN_URL }}

jobs:
  checkin:
    name: Keep daily credit streaks alive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run check-ins
        run: node scripts/checkin/checkin.mjs
