name: free-llm-scout Daily Run

on:
  schedule:
    # Run daily at 06:00 UTC (14:00 CST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/scout.yml'

permissions:
  contents: write # For committing generated files
  pull-requests: write # For creating PR with updates

env:
  # These must be set in GitHub repository Settings > Secrets > Actions
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
  MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
  BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  HF_API_KEY: ${{ secrets.HF_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  scout:
    name: Run free-llm-scout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm run build

      - name: Run free-llm-scout
        id: scout
        run: |
          node dist/cli.js \
            --sources openrouter,siliconflow,modelscope,bailian,zhipu,moonshot,custom-seeds \
            --validators openai-compat,tool-calling,structured-output \
            --max-models 20 \
            --concurrency 3 \
            --min-score 60 \
            --max-fleet 15 \
            --output ./data

      - name: Check for changes
        id: changes
        run: |
          # git status (not git diff): data/ files may be new/untracked, which
          # git diff never reports — that silently disabled the PR step before.
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in generated files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in generated files"
            git status --porcelain data/
          fi

      - name: Commit updated fleet data
        run: |
          git config user.name "free-llm-scout[bot]"
          git config user.email "scout@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily fleet update [skip ci]"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scout-output
          path: data/
          retention-days: 7

  test:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build